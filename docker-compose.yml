services:
  dfl-cuda:
    build:
      context: .
      dockerfile: Dockerfile
    image: nvidia-parallel-dfl:latest
    container_name: dfl_cuda_container
    ipc: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./docs:/workspace/docs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: python3 run_all_smoke.py
